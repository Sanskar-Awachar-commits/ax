name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ax-linux
            binary_name: ax
          - os: macos-latest
            artifact_name: ax-macos
            binary_name: ax
          - os: windows-latest
            artifact_name: ax-windows.exe
            binary_name: ax.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile on Linux / macOS
        if: runner.os != 'Windows'
        run: |
          c++ -O3 -std=c++20 ax.cpp -o ${{ matrix.binary_name }}

      - name: Compile on Windows
        if: runner.os == 'Windows'
        run: |
          g++ -O3 -std=c++20 ax.cpp -o ${{ matrix.binary_name }}

      - name: Stage Binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mv ${{ matrix.binary_name }} ${{ matrix.artifact_name }}
          chmod +x ${{ matrix.artifact_name }}

      - name: Stage Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          Move-Item -Path "${{ matrix.binary_name }}" -Destination "${{ matrix.artifact_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true